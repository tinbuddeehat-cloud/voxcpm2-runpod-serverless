name: Upload VoxCPM2 Model to RunPod Network Volume

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload-model:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_KEY }}
      AWS_DEFAULT_REGION: eur-no-1
      AWS_EC2_METADATA_DISABLED: "true"
      RUNPOD_S3_ENDPOINT: https://s3api-eur-no-1.runpod.io
      RUNPOD_S3_BUCKET: j4wacx25m1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check free disk
        run: df -h /

      - name: Install download and S3 tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "huggingface_hub>=0.34,<2" hf_xet "awscli>=1.32,<2"

      - name: Download required VoxCPM2 files
        shell: bash
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download

          files = [
              "model.safetensors",
              "audiovae.pth",
              "config.json",
              "tokenizer.json",
              "tokenizer_config.json",
              "special_tokens_map.json",
              "tokenization_voxcpm2.py",
          ]

          path = snapshot_download(
              repo_id="openbmb/VoxCPM2",
              local_dir="voxcpm2-local",
              allow_patterns=files,
          )
          print("Downloaded to:", path)
          PY

      - name: Validate model files
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("voxcpm2-local")
          required = [
              "model.safetensors",
              "audiovae.pth",
              "config.json",
              "tokenizer.json",
              "tokenizer_config.json",
              "special_tokens_map.json",
              "tokenization_voxcpm2.py",
          ]

          for name in required:
              p = root / name
              if not p.is_file() or p.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty: {p}")
              print(f"OK {name}: {p.stat().st_size / 1024 / 1024:.2f} MB")

          for name in ["config.json", "tokenizer_config.json", "special_tokens_map.json"]:
              with open(root / name, "r", encoding="utf-8") as f:
                  json.load(f)
              print("Valid JSON:", name)
          PY

      - name: Show model size
        run: |
          du -sh voxcpm2-local
          df -h /

      - name: Upload to RunPod Network Volume
        shell: bash
        run: |
          aws s3 sync \
            voxcpm2-local/ \
            "s3://${RUNPOD_S3_BUCKET}/voxcpm2-local/" \
            --endpoint-url "${RUNPOD_S3_ENDPOINT}" \
            --region "${AWS_DEFAULT_REGION}" \
            --exclude ".cache/*" \
            --only-show-errors

      - name: Verify files in RunPod S3
        shell: bash
        run: |
          echo "Files uploaded to RunPod:"
          aws s3 ls \
            "s3://${RUNPOD_S3_BUCKET}/voxcpm2-local/" \
            --endpoint-url "${RUNPOD_S3_ENDPOINT}" \
            --region "${AWS_DEFAULT_REGION}" \
            --recursive

          echo
          echo "Upload complete."
